[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-image-viewer"
version = "1.0.0"
description = "Viewing an image with selected areas of interest"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Muwsik", email = "nanoweb.assist@gmail.com" }]
dependencies = ["streamlit >= 1.51"]

[project.optional-dependencies]
devel = [
  "wheel",
  "pytest==7.4.0",
  "playwright==1.48.0",
  "requests==2.31.0",
  "pytest-playwright-snapshot==1.0",
  "pytest-rerunfailures==12.0",
]

[tool.setuptools.packages.find]
include = ["streamlit_image_viewer*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
streamlit_image_viewer = ["frontend/build/**/*", "pyproject.toml"]
